# Publishes hamdaz.com: every push to main (and a manual run from the Actions tab) builds the site and deploys it to
# Azure Static Web Apps (app "hamdaz-website", resource group "hamdaz"), then tells IndexNow search engines which
# pages changed.
#
# Needs one repository secret, AZURE_STATIC_WEB_APPS_API_TOKEN: the app's deployment token (Azure portal →
# hamdaz-website → Overview → Manage deployment token), added under GitHub → Settings → Secrets and variables →
# Actions.
name: Deploy hamdaz.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node build.mjs --dist

      - name: Keep a copy of the live sitemap (to see which pages change)
        run: curl -fsS https://hamdaz.com/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" || true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Tell IndexNow search engines (Bing and others) which pages changed
        run: node tools/indexnow.mjs "$RUNNER_TEMP/previous-sitemap.xml"
        continue-on-error: true
